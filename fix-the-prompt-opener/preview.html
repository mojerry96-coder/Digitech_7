<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fix the Prompt opener</title>
  <link rel="stylesheet" href="assets/fonts/fonts.css">
  <link rel="stylesheet" href="intro.css">
  <style>
    html, body { margin: 0; height: 100%; background: #09314F; color: #fff; font-family: "Manrope", system-ui, sans-serif; }
    .host { min-height: 100%; display: grid; place-items: center; text-align: center; }
    .host button { min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid rgba(255,255,255,.4); background: none; color: #fff; font: inherit; cursor: pointer; }
  </style>
</head>
<body>
  <!-- Stand-in for the simulation: Begin hands over here. Reload to replay; add ?skipintro to bypass. -->
  <main class="host" id="host" hidden><div><p>Begin handed over to the simulation.</p><button type="button" onclick="location.reload()">Replay opener</button></div></main>
  <script>window.FixThePrompt = { resumed: false, start: function () { document.getElementById("host").hidden = false; } };</script>
  <div id="intro" class="intro" role="dialog" aria-modal="true" aria-label="Fix the Prompt" data-host="FixThePrompt">
    <div class="intro-motif" aria-hidden="true"><img class="intro-motif-art" src="assets/logos/chevrons.svg" alt=""></div>
    <div class="intro-inner">
      <div class="intro-logos">
        <span class="intro-logo lg-ekiti"><img src="assets/logos/ekiti.svg" alt="Government of Ekiti State, Nigeria" /></span>
        <span class="intro-rule" aria-hidden="true"></span>
        <span class="intro-logo lg-miva"><img src="assets/logos/miva.svg" alt="MIVA Open University" /></span>
        <span class="intro-rule" aria-hidden="true"></span>
        <span class="intro-logo lg-tof"><img src="assets/logos/tof.svg" alt="Tunji Olowolafe Foundation" /></span>
      </div>
      <p class="intro-tagline">Study. Anywhere. Anyone. Anytime.</p>
      <h1 class="intro-title">Fix the <span class="accent">Prompt</span></h1>
      <p class="intro-sub">AI Literacy · Unit 2.2</p>
      <button class="intro-begin" type="button">Begin <svg viewBox="0 0 20 20" aria-hidden="true" focusable="false"><path d="M4 10h11M11 5.5l4.5 4.5-4.5 4.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
    <button class="intro-skip" type="button">Skip <kbd>Esc</kbd></button>
  </div>
  <script src="intro.js"></script>
</body>
</html>
